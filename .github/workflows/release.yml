name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Verify Android toolchain
        run: |
          java -version
          sdkmanager --version
          test -d "$ANDROID_HOME"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - name: Verify Flutter installation
        run: |
          flutter --version
          test -f "$(dirname "$(command -v flutter)")/internal/shared.sh"
      - name: Install Linux build dependencies
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=''; fi
          $SUDO apt-get update
          $SUDO apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF
      - run: flutter build linux --release
      - run: flutter build apk --release
      - name: Package Linux bundle
        run: |
          tar -C build/linux/x64/release -czf mooshrevolt-linux-x64.tar.gz bundle
          sha256sum mooshrevolt-linux-x64.tar.gz > mooshrevolt-linux-x64.tar.gz.sha256
          cp build/app/outputs/flutter-apk/app-release.apk mooshrevolt-android.apk
          sha256sum mooshrevolt-android.apk > mooshrevolt-android.apk.sha256
      - uses: actions/upload-artifact@v6
        if: github.server_url == 'https://github.com'
        with:
          name: flatpak-linux-input
          path: mooshrevolt-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v3
        if: github.server_url != 'https://github.com'
        with:
          name: flatpak-linux-input
          path: mooshrevolt-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Create draft GitHub release
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            mooshrevolt-linux-x64.tar.gz
            mooshrevolt-linux-x64.tar.gz.sha256
            mooshrevolt-android.apk
            mooshrevolt-android.apk.sha256
      - name: Create Gitea release and upload assets
        if: github.server_url != 'https://github.com'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$GITEA_TOKEN"
          release_json=$(curl --fail-with-body --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}" \
            "$GITEA_API_URL/repos/$REPOSITORY/releases")
          release_id=$(printf '%s' "$release_json" | sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p')
          test -n "$release_id"
          for asset in mooshrevolt-linux-x64.tar.gz mooshrevolt-linux-x64.tar.gz.sha256 mooshrevolt-android.apk mooshrevolt-android.apk.sha256; do
            curl --fail-with-body --request POST \
              --header "Authorization: token $GITEA_TOKEN" \
              --upload-file "$asset" \
              "$GITEA_API_URL/repos/$REPOSITORY/releases/$release_id/assets?name=$asset"
          done

  macos-release:
    # Gitea's Docker-based runner has no macOS host. The job runs after the
    # Linux job so it adds the disk image to the release that job created.
    if: github.server_url == 'https://github.com'
    needs: linux-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Import Developer ID certificate
        # Optional: without these secrets the image ships with the ad-hoc
        # signature and users allow it once in System Settings.
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "No signing certificate configured; building an ad-hoc signed image."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials mooshrevolt \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "NOTARY_PROFILE=mooshrevolt" >> "$GITHUB_ENV"
          fi
      - name: Build disk image
        run: ./tools/build_dmg.sh
      - name: Attach disk image to the release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            build/MooshRevolt-*-macos.dmg
            build/MooshRevolt-*-macos.dmg.sha256

  flatpak:
    needs: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v8
        if: github.server_url == 'https://github.com'
        with:
          name: flatpak-linux-input
      - uses: actions/download-artifact@v3
        if: github.server_url != 'https://github.com'
        with:
          name: flatpak-linux-input
      - name: Extract Linux bundle
        run: |
          mkdir -p build/linux/x64/release
          tar -xzf mooshrevolt-linux-x64.tar.gz -C build/linux/x64/release
      - name: Install Flatpak tooling
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=''; fi
          $SUDO apt-get update
          $SUDO apt-get install --yes flatpak flatpak-builder
      - name: Build Flatpak bundle
        run: |
          ./tools/build_flatpak.sh --skip-build
          cp build/ca.richyoung.mooshrevolt.flatpak mooshrevolt.flatpak
          sha256sum mooshrevolt.flatpak > mooshrevolt.flatpak.sha256
      - name: Attach Flatpak to GitHub draft release
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            mooshrevolt.flatpak
            mooshrevolt.flatpak.sha256
      - name: Attach Flatpak to Gitea release
        if: github.server_url != 'https://github.com'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          release_json=$(curl --fail-with-body --header "Authorization: token $GITEA_TOKEN" "$GITEA_API_URL/repos/$REPOSITORY/releases/tags/$TAG")
          release_id=$(printf '%s' "$release_json" | sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p')
          test -n "$release_id"
          for asset in mooshrevolt.flatpak mooshrevolt.flatpak.sha256; do
            curl --fail-with-body --request POST \
              --header "Authorization: token $GITEA_TOKEN" \
              --form "attachment=@$asset" \
              "$GITEA_API_URL/repos/$REPOSITORY/releases/$release_id/assets?name=$asset"
          done

  gtk4:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/gtk4.yml

  publish:
    name: Publish complete GitHub release
    if: github.server_url == 'https://github.com'
    needs: [linux-release, flatpak, gtk4, macos-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download GTK4 native archive
        uses: actions/download-artifact@v8
        with:
          name: mooshrevolt-linux-gtk4-x64
          path: release-assets
      - name: Download GTK4 Flatpak
        uses: actions/download-artifact@v8
        with:
          name: mooshrevolt-flatpak-gtk4-x64
          path: release-assets
      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          # Verify archived payloads before attaching them to the draft.
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          gh release upload "$RELEASE_TAG" ./* --clobber
          # Validate all platforms already attached by the preceding jobs.
          gh release download "$RELEASE_TAG" --dir ../verify-release
          cd ../verify-release
          test -s mooshrevolt-linux-x64.tar.gz
          test -s mooshrevolt-android.apk
          compgen -G "MooshRevolt-*-macos.dmg" >/dev/null
          test -s mooshrevolt.flatpak
          test -s "mooshrevolt-linux-gtk4-x64-$RELEASE_TAG.tar.gz"
          test -s "mooshrevolt-gtk4-x64-$RELEASE_TAG.flatpak"
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          gh release edit "$RELEASE_TAG" --draft=false
