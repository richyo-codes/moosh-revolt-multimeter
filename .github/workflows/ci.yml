name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - name: Verify Flutter installation
        run: |
          flutter --version
          test -f "$(dirname "$(command -v flutter)")/internal/shared.sh"
      - name: Install Linux build dependencies
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=''; fi
          $SUDO apt-get update
          $SUDO apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Compile standalone CSV logger
        run: dart run tool/mooshimeter_log.dart --help
      - name: Build Linux application
        run: flutter build linux --release
      - name: Upload Linux build
        uses: actions/upload-artifact@v6
        with:
          name: mooshrevolt-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

      - name: Build Flatpak bundle
        id: flatpak
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          ./tools/build_flatpak.sh --skip-build
      - name: Upload Flatpak bundle
        if: steps.flatpak.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mooshrevolt-flatpak
          path: build/ca.richyoung.mooshrevolt.flatpak
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Verify Android toolchain
        run: |
          java -version
          sdkmanager --version
          test -d "$ANDROID_HOME"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - name: Verify Flutter installation
        run: |
          flutter --version
          test -f "$(dirname "$(command -v flutter)")/internal/shared.sh"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: mooshrevolt-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    # Gitea's Docker-based Act Runner has no macOS host; build there only on
    # GitHub so the job does not queue forever elsewhere.
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: false
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build macOS application
        run: flutter build macos --release
      - name: Package app bundle
        run: |
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/MooshRevolt.app \
            mooshrevolt-macos.zip
      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: mooshrevolt-macos
          path: mooshrevolt-macos.zip
          if-no-files-found: error
          retention-days: 14
