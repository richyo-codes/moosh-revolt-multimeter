name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Install Linux build dependencies
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=''; fi
          $SUDO apt-get update
          $SUDO apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Compile standalone CSV logger
        run: dart run tool/mooshimeter_log.dart --help
      - name: Build Linux application
        run: flutter build linux --release
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: mooshrevolt-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mooshrevolt-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
