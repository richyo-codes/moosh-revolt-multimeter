name: moosh_revolt
description: "MooshRevolt: modern Android, Linux, and macOS client for the Mooshimeter BLE multimeter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  universal_ble: ^3.4.0
  bluez: ^0.9.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  provider: ^6.1.2
  mooshimeter_ble:
    path: packages/mooshimeter_ble
  path_provider: ^2.1.5
  url_launcher: ^6.3.3

dependency_overrides:
  url_launcher_linux:
    git:
      url: https://github.com/richyo-codes/packages
      ref: 3c47c005a32ecdd1baf6b021a09236548eb60909
      path: packages/url_launcher/url_launcher_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
